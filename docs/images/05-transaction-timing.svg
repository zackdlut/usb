<rect width="1120" height="700" fill="#ffffff"/>
<text x="560.0" y="32" font-size="20" text-anchor="middle" fill="#111827" font-weight="bold">按真实比例：一个 64 字节批量 OUT 事务要多久</text>
<text x="560.0" y="56" font-size="12.5" text-anchor="middle" fill="#4b5563">全速 12 Mbit/s，1 位 = 83.3 ns，12 位 = 1 µs。下面每个色块的宽度都和它占用的位数成正比</text>
<rect x="60.0" y="130" width="57.66062602965404" height="40" rx="2" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
<rect x="120.95551894563427" y="130" width="13.179571663920923" height="40" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
<rect x="134.1350906095552" y="130" width="13.179571663920923" height="40" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
<rect x="147.31466227347613" y="130" width="843.4925864909391" height="40" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
<text x="569.0609555189457" y="154.5" font-size="12" text-anchor="middle" fill="#075985" font-weight="bold">DATA0：64 字节负载 = 512 位（≈ 42.7 µs）</text>
<rect x="990.8072487644151" y="130" width="26.359143327841846" height="40" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
