<text x="257.6935749588139" y="258" font-size="10.5" text-anchor="middle" fill="#6b7280">10 µs</text>
<line x1="356.54036243822077" y1="236" x2="356.54036243822077" y2="244" stroke="#6b7280" stroke-width="1.2"/>
<text x="356.54036243822077" y="258" font-size="10.5" text-anchor="middle" fill="#6b7280">15 µs</text>
<line x1="455.3871499176277" y1="236" x2="455.3871499176277" y2="244" stroke="#6b7280" stroke-width="1.2"/>
<text x="455.3871499176277" y="258" font-size="10.5" text-anchor="middle" fill="#6b7280">20 µs</text>
<line x1="554.2339373970347" y1="236" x2="554.2339373970347" y2="244" stroke="#6b7280" stroke-width="1.2"/>
<text x="554.2339373970347" y="258" font-size="10.5" text-anchor="middle" fill="#6b7280">25 µs</text>
<line x1="653.0807248764415" y1="236" x2="653.0807248764415" y2="244" stroke="#6b7280" stroke-width="1.2"/>
<text x="653.0807248764415" y="258" font-size="10.5" text-anchor="middle" fill="#6b7280">30 µs</text>
<line x1="751.9275123558484" y1="236" x2="751.9275123558484" y2="244" stroke="#6b7280" stroke-width="1.2"/>
<text x="751.9275123558484" y="258" font-size="10.5" text-anchor="middle" fill="#6b7280">35 µs</text>
<line x1="850.7742998352554" y1="236" x2="850.7742998352554" y2="244" stroke="#6b7280" stroke-width="1.2"/>
<text x="850.7742998352554" y="258" font-size="10.5" text-anchor="middle" fill="#6b7280">40 µs</text>
<line x1="949.6210873146623" y1="236" x2="949.6210873146623" y2="244" stroke="#6b7280" stroke-width="1.2"/>
<text x="949.6210873146623" y="258" font-size="10.5" text-anchor="middle" fill="#6b7280">45 µs</text>
<line x1="1048.4678747940693" y1="236" x2="1048.4678747940693" y2="244" stroke="#6b7280" stroke-width="1.2"/>
<text x="1048.4678747940693" y="258" font-size="10.5" text-anchor="middle" fill="#6b7280">50 µs</text>
<text x="560" y="278" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="bold">一个事务合计约 607 位 ≈ 50.6 µs</text>
<text x="60" y="288" font-size="13" text-anchor="start" fill="#3730a3" font-weight="bold">令牌包 OUT：35 位 ≈ 2.9 µs（放大）</text>
<path d="M60.0 170 L60 300" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M117.66062602965404 170 L375 300" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="60" y="300" width="72" height="36" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
<text x="96.0" y="316" font-size="11" text-anchor="middle" fill="#374151" font-weight="bold">SYNC</text>
<text x="96.0" y="330" font-size="10" text-anchor="middle" fill="#4b5563">8 位</text>
<rect x="132" y="300" width="72" height="36" rx="2" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="168.0" y="316" font-size="11" text-anchor="middle" fill="#3730a3" font-weight="bold">PID</text>
<text x="168.0" y="330" font-size="10" text-anchor="middle" fill="#4b5563">8 位</text>
<rect x="204" y="300" width="63" height="36" rx="2" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="235.5" y="316" font-size="11" text-anchor="middle" fill="#3730a3" font-weight="bold">ADDR</text>
<text x="235.5" y="330" font-size="10" text-anchor="middle" fill="#4b5563">7 位</text>
<rect x="267" y="300" width="36" height="36" rx="2" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="285.0" y="316" font-size="11" text-anchor="middle" fill="#3730a3" font-weight="bold">ENDP</text>
<text x="285.0" y="330" font-size="10" text-anchor="middle" fill="#4b5563">4 位</text>
<rect x="303" y="300" width="45" height="36" rx="2" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="325.5" y="316" font-size="11" text-anchor="middle" fill="#3730a3" font-weight="bold">CRC5</text>
<text x="325.5" y="330" font-size="10" text-anchor="middle" fill="#4b5563">5 位</text>
<rect x="348" y="300" width="27" height="36" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
<text x="361.5" y="316" font-size="11" text-anchor="middle" fill="#b91c1c" font-weight="bold">EOP</text>
<text x="361.5" y="330" font-size="10" text-anchor="middle" fill="#4b5563">3 位</text>
<text x="889" y="288" font-size="13" text-anchor="start" fill="#15803d" font-weight="bold">握手包 ACK：19 位 ≈ 1.6 µs（放大）</text>
<path d="M1028.6985172981879 170 L889 300" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M1060.0 170 L1060 300" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="889" y="300" width="72" height="36" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
<text x="925.0" y="316" font-size="11" text-anchor="middle" fill="#374151" font-weight="bold">SYNC</text>
<text x="925.0" y="330" font-size="10" text-anchor="middle" fill="#4b5563">8 位</text>
<rect x="961" y="300" width="72" height="36" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="997.0" y="316" font-size="11" text-anchor="middle" fill="#15803d" font-weight="bold">PID</text>
<text x="997.0" y="330" font-size="10" text-anchor="middle" fill="#4b5563">8 位</text>
<rect x="1033" y="300" width="27" height="36" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
<text x="1046.5" y="316" font-size="11" text-anchor="middle" fill="#b91c1c" font-weight="bold">EOP</text>
<text x="1046.5" y="330" font-size="10" text-anchor="middle" fill="#4b5563">3 位</text>
<text x="560" y="312" font-size="11.5" text-anchor="middle" fill="#b91c1c" font-weight="bold">EOP = SE0 两位 + J 一位</text>
<text x="560" y="330" font-size="11.5" text-anchor="middle" fill="#374151">设备不回答时，主机等 16–18 位就判超时</text>
<line x1="20" y1="378" x2="1100" y2="378" stroke="#e5e7eb" stroke-width="2"/>
<text x="30" y="400" font-size="14" text-anchor="start" fill="#374151" font-weight="bold">规范给的“每个事务 13 字节开销”就是这些东西加起来：</text>
<rect x="30" y="414" width="176" height="46" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="118.0" y="433" font-size="12" text-anchor="middle" fill="#374151" font-weight="bold">3 个 SYNC</text>
<text x="118.0" y="451" font-size="11.5" text-anchor="middle" fill="#374151">3 字节</text>
<text x="211" y="442" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="bold">+</text>
<rect x="216" y="414" width="176" height="46" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="304.0" y="433" font-size="12" text-anchor="middle" fill="#3730a3" font-weight="bold">3 个 PID</text>
<text x="304.0" y="451" font-size="11.5" text-anchor="middle" fill="#374151">3 字节</text>
<text x="397" y="442" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="bold">+</text>
<rect x="402" y="414" width="176" height="46" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="490.0" y="433" font-size="12" text-anchor="middle" fill="#3730a3" font-weight="bold">ADDR + ENDP + CRC5</text>
<text x="490.0" y="451" font-size="11.5" text-anchor="middle" fill="#374151">2 字节</text>
<text x="583" y="442" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="bold">+</text>
<rect x="588" y="414" width="176" height="46" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="676.0" y="433" font-size="12" text-anchor="middle" fill="#075985" font-weight="bold">CRC16</text>
<text x="676.0" y="451" font-size="11.5" text-anchor="middle" fill="#374151">2 字节</text>
<text x="769" y="442" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="bold">+</text>
<rect x="774" y="414" width="176" height="46" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="862.0" y="433" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">3 个 EOP + 包间隔</text>
<text x="862.0" y="451" font-size="11.5" text-anchor="middle" fill="#374151">3 字节</text>
<text x="964" y="442" font-size="15" text-anchor="start" fill="#111827" font-weight="bold">= 13 字节</text>
<text x="30" y="486" font-size="12.5" text-anchor="start" fill="#374151">64 字节负载 + 13 字节开销 = 77 字节 ≈ 51 µs。同步传输没有握手包，少一个 SYNC、一个 PID、一个 EOP，开销是 9 字节。</text>
<text x="30" y="506" font-size="12.5" text-anchor="start" fill="#374151">另外，数据里每出现连续 6 个 1 还要插 1 位（第 2 章的位填充），最坏情况下再多 1/6。</text>
<text x="30" y="558" font-size="14" text-anchor="start" fill="#374151" font-weight="bold">所以 1 ms 一帧（1500 字节）里最多能排 19 个这样的事务：</text>
