<line x1="60.0" y1="236" x2="60.0" y2="244" stroke="#6b7280" stroke-width="1.2"/>
<text x="60.0" y="258" font-size="10.5" text-anchor="middle" fill="#6b7280">0 µs</text>
<line x1="158.84678747940694" y1="236" x2="158.84678747940694" y2="244" stroke="#6b7280" stroke-width="1.2"/>
<text x="158.84678747940694" y="258" font-size="10.5" text-anchor="middle" fill="#6b7280">5 µs</text>
