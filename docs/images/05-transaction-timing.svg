<path d="M60.0 126 L60.0 120 L1022.1087314662274 120 L1022.1087314662274 126" fill="none" stroke="#4f46e5" stroke-width="1.4"/>
<text x="541.0543657331136" y="115" font-size="12" text-anchor="middle" fill="#3730a3" font-weight="bold">主机发出：令牌包 OUT + 数据包 DATA0</text>
<path d="M1028.6985172981879 126 L1028.6985172981879 120 L1060.0 120 L1060.0 126" fill="none" stroke="#16a34a" stroke-width="1.4"/>
<text x="1044.3492586490938" y="115" font-size="12" text-anchor="middle" fill="#15803d" font-weight="bold">设备</text>
<line x1="119.30807248764415" y1="128" x2="119.30807248764415" y2="100" stroke="#b91c1c" stroke-width="1" stroke-dasharray="2 2"/>
<text x="119.30807248764415" y="96" font-size="11" text-anchor="middle" fill="#b91c1c" font-weight="bold">包间隔 ≥ 2 位</text>
<line x1="1025.4036243822075" y1="128" x2="1025.4036243822075" y2="100" stroke="#b91c1c" stroke-width="1" stroke-dasharray="2 2"/>
<text x="1021.4036243822075" y="96" font-size="11" text-anchor="end" fill="#b91c1c" font-weight="bold">设备 2–6.5 位内必须开始回答</text>
<line x1="127.54530477759472" y1="170" x2="127.54530477759472" y2="189" stroke="#9ca3af" stroke-width="1"/>
<text x="127.54530477759472" y="200" font-size="11" text-anchor="start" fill="#374151">SYNC</text>
<line x1="140.72487644151565" y1="170" x2="140.72487644151565" y2="205" stroke="#9ca3af" stroke-width="1"/>
<text x="140.72487644151565" y="216" font-size="11" text-anchor="start" fill="#374151">PID</text>
<line x1="1003.986820428336" y1="170" x2="1003.986820428336" y2="189" stroke="#9ca3af" stroke-width="1"/>
<text x="1003.986820428336" y="200" font-size="11" text-anchor="end" fill="#374151">CRC16</text>
<line x1="1019.6375617792422" y1="170" x2="1019.6375617792422" y2="205" stroke="#9ca3af" stroke-width="1"/>
<text x="1019.6375617792422" y="216" font-size="11" text-anchor="end" fill="#374151">EOP</text>
