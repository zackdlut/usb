<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs>
<rect width="1000" height="700" fill="#ffffff"/>
<text x="500" y="32" font-size="20" text-anchor="middle" fill="#111827" font-weight="bold">排错路线：先看主机说了什么，再定位到是哪一层</text>
<rect x="30" y="70" width="300" height="58" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="180.0" y="105" font-size="12.5" text-anchor="middle" fill="#3730a3" font-weight="bold">dmesg 里有 new full-speed USB device 吗？</text>
<line x1="330" y1="99.0" x2="376" y2="99.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="355.0" y="92.0" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">没有</text>
<rect x="380" y="60" width="270" height="82" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="392" y="82" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">主机根本没看到设备</text>
<text x="392" y="102" font-size="11" text-anchor="start" fill="#374151">只能充电的线 · 接错 USB 口</text>
<text x="392" y="119" font-size="11" text-anchor="start" fill="#374151">D+ 没上拉 · VBUS 检测 · WSL 没 attach</text>
<text x="640" y="136" font-size="10.5" text-anchor="end" fill="#6b7280">第 2、10、11 章</text>
<line x1="180.0" y1="128" x2="180.0" y2="172" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="190.0" y="158" font-size="12" text-anchor="start" fill="#15803d" font-weight="bold">有</text>
<rect x="30" y="176" width="300" height="58" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="180.0" y="211" font-size="12.5" text-anchor="middle" fill="#3730a3" font-weight="bold">有 device descriptor read/64, error -71 吗？</text>
<line x1="330" y1="205.0" x2="376" y2="205.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="355.0" y="198.0" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">有</text>
<rect x="380" y="166" width="270" height="82" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="392" y="188" font-size="13" text-anchor="start" fill="#b91c1c" font-weight="bold">包到了，但主机解不出来</text>
<text x="392" y="208" font-size="11" text-anchor="start" fill="#374151">48 MHz 不准（HSI）· HSE 没起振</text>
<text x="392" y="225" font-size="11" text-anchor="start" fill="#374151">接线、焊接、线太长</text>
<text x="640" y="242" font-size="10.5" text-anchor="end" fill="#6b7280">第 2 章 · 本章故障 1</text>
<line x1="180.0" y1="234" x2="180.0" y2="278" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="190.0" y="264" font-size="12" text-anchor="start" fill="#15803d" font-weight="bold">否</text>
<rect x="30" y="282" width="300" height="58" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="180.0" y="317" font-size="12.5" text-anchor="middle" fill="#3730a3" font-weight="bold">有 device not accepting address 吗？</text>
<line x1="330" y1="311.0" x2="376" y2="311.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="355.0" y="304.0" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">有</text>
<rect x="380" y="272" width="270" height="82" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="392" y="294" font-size="13" text-anchor="start" fill="#c2410c" font-weight="bold">SET_ADDRESS 没做对</text>
<text x="392" y="314" font-size="11" text-anchor="start" fill="#374151">地址在状态阶段之前就换了</text>
<text x="392" y="331" font-size="11" text-anchor="start" fill="#374151">或者 SET_ADDRESS 后没及时响应</text>
<text x="640" y="348" font-size="10.5" text-anchor="end" fill="#6b7280">第 7 章</text>
<line x1="180.0" y1="340" x2="180.0" y2="384" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="190.0" y="370" font-size="12" text-anchor="start" fill="#15803d" font-weight="bold">否</text>
<rect x="30" y="388" width="300" height="58" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="180.0" y="423" font-size="12.5" text-anchor="middle" fill="#3730a3" font-weight="bold">lsusb 能看到，但驱动没绑上 / 程序打不开？</text>
<line x1="330" y1="417.0" x2="376" y2="417.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="355.0" y="410.0" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">是</text>
<rect x="380" y="378" width="270" height="82" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="392" y="400" font-size="13" text-anchor="start" fill="#b45309" font-weight="bold">描述符或权限</text>
<text x="392" y="420" font-size="11" text-anchor="start" fill="#374151">类代码、接口、端点写错 · wTotalLength</text>
<text x="392" y="437" font-size="11" text-anchor="start" fill="#374151">udev 权限 · 接口被内核驱动占着</text>
<text x="640" y="454" font-size="10.5" text-anchor="end" fill="#6b7280">第 6、8、9、10 章 · 故障 2</text>
<line x1="180.0" y1="446" x2="180.0" y2="490" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="190.0" y="476" font-size="12" text-anchor="start" fill="#15803d" font-weight="bold">否</text>
<rect x="30" y="494" width="300" height="58" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="180.0" y="519" font-size="12.5" text-anchor="middle" fill="#3730a3" font-weight="bold">枚举成功、程序能打开设备，</text>
<text x="180.0" y="538" font-size="12.5" text-anchor="middle" fill="#3730a3" font-weight="bold">但数据传不对？看返回的错误码</text>
<path d="M180.0 552 L180.0 570 L130 570 L130 588" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="30" y="592" width="200" height="92" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="42" y="614" font-size="13" text-anchor="start" fill="#b45309" font-weight="bold">TIMEOUT / -110</text>
<text x="42" y="636" font-size="11" text-anchor="start" fill="#374151">设备一直 NAK：固件没写数据</text>
<text x="42" y="653" font-size="11" text-anchor="start" fill="#374151">或者在等一个不会来的 ZLP</text>
<text x="218" y="674" font-size="10.5" text-anchor="end" fill="#6b7280">第 4、9 章 · 故障 3</text>
<path d="M180.0 552 L180.0 570 L340 570 L340 588" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="240" y="592" width="200" height="92" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="252" y="614" font-size="13" text-anchor="start" fill="#b91c1c" font-weight="bold">PIPE / -32（STALL）</text>
<text x="252" y="636" font-size="11" text-anchor="start" fill="#374151">请求不支持，或端点被停用</text>
<text x="252" y="653" font-size="11" text-anchor="start" fill="#374151">CLEAR_FEATURE 后翻转位归零</text>
<text x="428" y="674" font-size="10.5" text-anchor="end" fill="#6b7280">第 7 章</text>
<path d="M180.0 552 L180.0 570 L550 570 L550 588" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="450" y="592" width="200" height="92" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="462" y="614" font-size="13" text-anchor="start" fill="#15803d" font-weight="bold">没有错误，但少数据</text>
<text x="462" y="636" font-size="11" text-anchor="start" fill="#374151">数据翻转位两边不一致</text>
<text x="462" y="653" font-size="11" text-anchor="start" fill="#374151">（静默丢包，最难查）</text>
<text x="638" y="674" font-size="10.5" text-anchor="end" fill="#6b7280">第 4 章 · 故障 4</text>
<rect x="680" y="62" width="295" height="618" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
<text x="827.5" y="88" font-size="14" text-anchor="middle" fill="#374151" font-weight="bold">每种工具能看到哪一层</text>
<rect x="696" y="106" width="263" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="710" y="130" font-size="13" text-anchor="start" fill="#15803d" font-weight="bold">应用</text>
<text x="710" y="152" font-size="11" text-anchor="start" fill="#374151">libusb 返回值、printf</text>
<text x="710" y="170" font-size="11" text-anchor="start" fill="#374151">TIMEOUT / PIPE / IO</text>
<rect x="696" y="202" width="263" height="80" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="710" y="226" font-size="13" text-anchor="start" fill="#3730a3" font-weight="bold">USB 核心（URB）</text>
<text x="710" y="248" font-size="11" text-anchor="start" fill="#374151">Wireshark + usbmon（Linux）</text>
<text x="710" y="266" font-size="11" text-anchor="start" fill="#374151">Wireshark + USBPcap（Windows）</text>
<rect x="696" y="298" width="263" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="710" y="322" font-size="13" text-anchor="start" fill="#b45309" font-weight="bold">主控制器（事务）</text>
<text x="710" y="344" font-size="11" text-anchor="start" fill="#374151">NAK、重试、SOF 在这里</text>
<text x="710" y="362" font-size="11" text-anchor="start" fill="#374151">被硬件处理掉，软件看不到</text>
<rect x="696" y="394" width="263" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="710" y="418" font-size="13" text-anchor="start" fill="#b91c1c" font-weight="bold">线上（包、电平）</text>
<text x="710" y="440" font-size="11" text-anchor="start" fill="#374151">USB 协议分析仪</text>
<text x="710" y="458" font-size="11" text-anchor="start" fill="#374151">示波器 / 逻辑分析仪（sigrok）</text>
<text x="706" y="520" font-size="12" text-anchor="start" fill="#374151" font-weight="bold">越往下看得越细，工具也越贵。</text>
<text x="706" y="544" font-size="11.5" text-anchor="start" fill="#4b5563">软件抓包看到的是“传输”：</text>
<text x="706" y="563" font-size="11.5" text-anchor="start" fill="#4b5563">一次 GET_DESCRIPTOR 的请求和结果，</text>
<text x="706" y="582" font-size="11.5" text-anchor="start" fill="#4b5563">看不到中间的 NAK 和重试。</text>
<text x="706" y="610" font-size="11.5" text-anchor="start" fill="#b45309" font-weight="bold">本教程的模拟器（trace.level）</text>
<text x="706" y="629" font-size="11.5" text-anchor="start" fill="#b45309" font-weight="bold">四层都能看到：kTransfer → kWire。</text>
<text x="706" y="656" font-size="11.5" text-anchor="start" fill="#b91c1c">WSL2 内核没有 usbmon：在 Windows 上抓。</text>
</svg>
