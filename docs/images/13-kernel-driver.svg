<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1000" height="720" fill="#ffffff"/>
<text x="500" y="32" font-size="20" text-anchor="middle" fill="#111827" font-weight="bold">Linux 内核 USB 驱动：从 probe 到 /dev 节点</text>
<text x="370" y="64" font-size="15" text-anchor="middle" fill="#374151" font-weight="bold">① 三种访问同一设备的方式</text>
<text x="140" y="90" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="bold">第 10 章 libusb（用户态）</text>
<rect x="30" y="98" width="220" height="40" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="140" y="123" font-size="12" text-anchor="middle" fill="#c2410c">vendor_client / lsusb_lite</text>
<rect x="30" y="146" width="220" height="40" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="140" y="171" font-size="12" text-anchor="middle" fill="#c2410c">libusb 到 usbfs</text>
<text x="370" y="90" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="bold">第 13 章内核驱动（本章）</text>
<rect x="260" y="98" width="220" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="370" y="123" font-size="12" text-anchor="middle" fill="#b45309">test_chardev / ioctl</text>
<rect x="260" y="146" width="220" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="370" y="171" font-size="12" text-anchor="middle" fill="#b45309">miniusb_vendor.ko</text>
<text x="600" y="90" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="bold">标准类（对比）</text>
<rect x="490" y="98" width="220" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="600" y="123" font-size="12" text-anchor="middle" fill="#15803d">open /dev/ttyACM0</text>
<rect x="490" y="146" width="220" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="600" y="171" font-size="12" text-anchor="middle" fill="#15803d">cdc_acm（内核自带）</text>
<line x1="140" y1="138" x2="140" y2="146" stroke="#6b7280" stroke-width="2"/>
<line x1="370" y1="138" x2="370" y2="146" stroke="#6b7280" stroke-width="2"/>
<line x1="600" y1="138" x2="600" y2="146" stroke="#6b7280" stroke-width="2"/>
<line x1="20" y1="200" x2="720" y2="200" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="370" y="224" font-size="13" text-anchor="middle" fill="#6b7280">内核态，共享同一套 USB 核心</text>
<rect x="30" y="236" width="680" height="44" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="370" y="258" font-size="13" text-anchor="middle" fill="#3730a3" font-weight="bold">USB 核心（hub.c、message.c：枚举、URB 提交、匹配驱动）</text>
<text x="370" y="274" font-size="11" text-anchor="middle" fill="#4b5563">usb_register_driver 后 probe 你的模块，第 7 章 Host::enumerate</text>
<rect x="30" y="292" width="680" height="44" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="370" y="314" font-size="13" text-anchor="middle" fill="#3730a3" font-weight="bold">主机控制器驱动（xHCI / EHCI 等）</text>
<text x="370" y="330" font-size="11" text-anchor="middle" fill="#4b5563">第 4、5 章：包、事务、调度</text>
<rect x="30" y="348" width="680" height="36" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="370" y="372" font-size="13" text-anchor="middle" fill="#374151" font-weight="bold">D+ / D- 第 11 章 STM32 固件（cafe:4011）</text>
<text x="500" y="400" font-size="15" text-anchor="middle" fill="#374151" font-weight="bold">② 本章驱动的生命周期（对照代码）</text>
<rect x="40" y="416" width="150" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="115" y="438" font-size="12" text-anchor="middle" fill="#b45309" font-weight="bold">insmod</text>
<text x="115" y="456" font-size="11" text-anchor="middle" fill="#4b5563">usb_register</text>
<line x1="190" y1="442" x2="218" y2="442" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<rect x="220" y="416" width="150" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="295" y="438" font-size="12" text-anchor="middle" fill="#b45309" font-weight="bold">插入设备</text>
<text x="295" y="456" font-size="11" text-anchor="middle" fill="#4b5563">id_table 匹配</text>
<line x1="370" y1="442" x2="398" y2="442" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<rect x="400" y="416" width="150" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="475" y="438" font-size="12" text-anchor="middle" fill="#b45309" font-weight="bold">probe()</text>
<text x="475" y="456" font-size="11" text-anchor="middle" fill="#4b5563">misc 到 /dev</text>
<line x1="550" y1="442" x2="578" y2="442" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<rect x="580" y="416" width="150" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="655" y="438" font-size="12" text-anchor="middle" fill="#b45309" font-weight="bold">read/write</text>
<text x="655" y="456" font-size="11" text-anchor="middle" fill="#4b5563">usb_bulk_msg</text>
<line x1="760" y1="442" x2="788" y2="442" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<rect x="790" y="416" width="150" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="865" y="438" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">拔出/rmmod</text>
<text x="865" y="456" font-size="11" text-anchor="middle" fill="#4b5563">disconnect()</text>
<text x="500" y="498" font-size="15" text-anchor="middle" fill="#374151" font-weight="bold">③ 一次批量回环在内核里怎么走</text>
<rect x="40" y="514" width="130" height="44" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="105" y="535" font-size="11" text-anchor="middle" fill="#c2410c">用户 write()</text>
<text x="105" y="550" font-size="10" text-anchor="middle" fill="#4b5563">数据进内核缓冲</text>
<line x1="170" y1="536" x2="198" y2="536" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="514" width="140" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="270" y="535" font-size="11" text-anchor="middle" fill="#b45309">usb_bulk_msg OUT</text>
<text x="270" y="550" font-size="10" text-anchor="middle" fill="#4b5563">端点 0x01</text>
<line x1="340" y1="536" x2="368" y2="536" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="370" y="514" width="110" height="44" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="425" y="535" font-size="11" text-anchor="middle" fill="#374151">URB到 HC</text>
<text x="425" y="550" font-size="10" text-anchor="middle" fill="#4b5563">第 4 章事务</text>
<line x1="480" y1="536" x2="508" y2="536" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="510" y="514" width="110" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="565" y="535" font-size="11" text-anchor="middle" fill="#15803d">固件回环</text>
<text x="565" y="550" font-size="10" text-anchor="middle" fill="#4b5563">第 11 章</text>
<line x1="620" y1="536" x2="648" y2="536" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="650" y="514" width="140" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="720" y="535" font-size="11" text-anchor="middle" fill="#b45309">usb_bulk_msg IN</text>
<text x="720" y="550" font-size="10" text-anchor="middle" fill="#4b5563">端点 0x81</text>
<line x1="790" y1="536" x2="818" y2="536" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="820" y="514" width="130" height="44" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="885" y="535" font-size="11" text-anchor="middle" fill="#c2410c">返回用户态</text>
<text x="885" y="550" font-size="10" text-anchor="middle" fill="#4b5563">write 完成</text>
<text x="500" y="592" font-size="12" text-anchor="middle" fill="#6b7280">内核驱动绑定后，libusb 无法再 claim 同一接口（须先 rmmod 或解绑）</text>
<text x="500" y="616" font-size="12" text-anchor="middle" fill="#6b7280">与第 10 章 vendor_client 同一协议，经 /dev/miniusb_vendor 暴露给应用</text>
<text x="40" y="648" font-size="12" text-anchor="start" fill="#374151">虚线以上三条路只能选其一绑定厂商设备；类驱动与 libusb 的争用见第 10 章 detach。</text>
<text x="40" y="670" font-size="12" text-anchor="start" fill="#374151">步骤 1 probe，步骤 2 sysfs GET_INFO，步骤 3 misc 字符设备：examples/13-kernel-driver/</text>
</svg>
