<text x="500" y="632" font-size="12" text-anchor="middle" fill="#4b5563">位填充：数据里出现连续 6 个 1，就强行插一个 0（本包没有触发）。全速每位 83.3 ns，这个包共 19 位 ≈ 1.58 µs。</text>
