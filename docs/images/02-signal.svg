<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
<rect width="1000" height="650" fill="#ffffff"/>
<text x="500" y="32" font-size="20" text-anchor="middle" fill="#111827" font-weight="bold">物理层：一个 ACK 包在 D+ / D− 上的样子</text>
<text x="250" y="66" font-size="16" text-anchor="middle" fill="#374151" font-weight="bold">① 插上就被发现：上拉电阻</text>
<rect x="30" y="80" width="150" height="170" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="105" y="104" font-size="15" text-anchor="middle" fill="#3730a3" font-weight="bold">主机</text>
<rect x="320" y="80" width="170" height="170" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="370" y="104" font-size="15" text-anchor="middle" fill="#15803d" font-weight="bold">全速设备</text>
<line x1="180" y1="140" x2="320" y2="140" stroke="#111827" stroke-width="3"/>
<text x="250" y="132" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">D+</text>
<line x1="120" y1="140" x2="180" y2="140" stroke="#111827" stroke-width="2"/>
<rect x="108" y="146" width="24" height="30" rx="2" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="100" y="166" font-size="11" text-anchor="end" fill="#3730a3">15k</text>
<line x1="120" y1="140" x2="120" y2="146" stroke="#111827" stroke-width="2"/>
<line x1="120" y1="176" x2="120" y2="182" stroke="#111827" stroke-width="2"/>
<line x1="110" y1="182" x2="130" y2="182" stroke="#111827" stroke-width="2"/>
<line x1="180" y1="200" x2="320" y2="200" stroke="#111827" stroke-width="3"/>
<text x="250" y="192" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">D−</text>
<line x1="120" y1="200" x2="180" y2="200" stroke="#111827" stroke-width="2"/>
<rect x="108" y="206" width="24" height="30" rx="2" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="100" y="226" font-size="11" text-anchor="end" fill="#3730a3">15k</text>
<line x1="120" y1="200" x2="120" y2="206" stroke="#111827" stroke-width="2"/>
<line x1="120" y1="236" x2="120" y2="242" stroke="#111827" stroke-width="2"/>
<line x1="110" y1="242" x2="130" y2="242" stroke="#111827" stroke-width="2"/>
<line x1="320" y1="140" x2="450" y2="140" stroke="#111827" stroke-width="2"/>
<line x1="450" y1="140" x2="450" y2="134" stroke="#111827" stroke-width="2"/>
<rect x="438" y="110" width="24" height="24" rx="2" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<line x1="450" y1="110" x2="450" y2="100" stroke="#111827" stroke-width="2"/>
<line x1="438" y1="100" x2="462" y2="100" stroke="#111827" stroke-width="2"/>
<text x="450" y="94" font-size="11" text-anchor="middle" fill="#c2410c" font-weight="bold">3.3 V</text>
<text x="432" y="128" font-size="12" text-anchor="end" fill="#c2410c" font-weight="bold">1.5k</text>
<text x="405" y="224" font-size="12" text-anchor="middle" fill="#15803d">D− 不接上拉</text>
<text x="30" y="276" font-size="13" text-anchor="start" fill="#374151">• 主机两根线都有 15k 下拉：空闲时都是低电平</text>
<text x="30" y="298" font-size="13" text-anchor="start" fill="#374151">• 设备把 D+ 拉高 → 主机知道“来了个全速设备”</text>
<text x="30" y="320" font-size="13" text-anchor="start" fill="#374151">• 拉的是 D− → 低速设备；高速设备先按全速连接</text>
<line x1="500" y1="56" x2="500" y2="330" stroke="#e5e7eb" stroke-width="2"/>
<text x="750" y="66" font-size="16" text-anchor="middle" fill="#374151" font-weight="bold">② 线路只有 3 种状态（全速）</text>
<rect x="530" y="86" width="440" height="50" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
<text x="560" y="117" font-size="18" text-anchor="middle" fill="#4f46e5" font-weight="bold" font-family="monospace">J</text>
<rect x="600" y="99" width="34" height="24" rx="12" fill="#111827" stroke="#111827" stroke-width="1.5"/>
<text x="617" y="116" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">D+</text>
<rect x="640" y="99" width="34" height="24" rx="12" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<text x="657" y="116" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">D−</text>
<text x="690" y="108" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">D+ 高，D− 低</text>
<text x="690" y="128" font-size="12" text-anchor="start" fill="#4b5563">空闲状态就是 J</text>
<rect x="530" y="148" width="440" height="50" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
<text x="560" y="179" font-size="18" text-anchor="middle" fill="#16a34a" font-weight="bold" font-family="monospace">K</text>
<rect x="600" y="161" width="34" height="24" rx="12" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<text x="617" y="178" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">D+</text>
<rect x="640" y="161" width="34" height="24" rx="12" fill="#111827" stroke="#111827" stroke-width="1.5"/>
<text x="657" y="178" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">D−</text>
<text x="690" y="170" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">D+ 低，D− 高</text>
<text x="690" y="190" font-size="12" text-anchor="start" fill="#4b5563">与 J 相反</text>
<rect x="530" y="210" width="440" height="50" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
<text x="560" y="241" font-size="18" text-anchor="middle" fill="#ea580c" font-weight="bold" font-family="monospace">SE0</text>
<rect x="600" y="223" width="34" height="24" rx="12" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<text x="617" y="240" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">D+</text>
<rect x="640" y="223" width="34" height="24" rx="12" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<text x="657" y="240" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">D−</text>
<text x="690" y="232" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">两根都低</text>
<text x="690" y="252" font-size="12" text-anchor="start" fill="#4b5563">包结束；持续 ≥10 ms = 总线复位</text>
<text x="530" y="290" font-size="12" text-anchor="start" fill="#4b5563">低速设备的 J/K 正好反过来（D− 高才是 J）。</text>
<text x="530" y="312" font-size="12" text-anchor="start" fill="#4b5563">教程里统一按全速讲。</text>
<line x1="30" y1="340" x2="970" y2="340" stroke="#e5e7eb" stroke-width="2"/>
<text x="500" y="368" font-size="16" text-anchor="middle" fill="#374151" font-weight="bold">③ 编码流水线：字节 → 比特（低位先发）→ 位填充 → NRZI（0 翻转，1 不变）</text>
<rect x="122" y="384" width="332" height="26" rx="4" fill="#4f46e5" fill-opacity="0.12" stroke="#4f46e5" stroke-width="1.5"/>
<text x="288.0" y="402" font-size="13" text-anchor="middle" fill="#4f46e5" font-weight="bold">SYNC = 0x80</text>
