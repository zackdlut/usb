<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs>
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500" y="32" font-size="20" text-anchor="middle" fill="#111827" font-weight="bold">枚举：设备插上后的头 100 毫秒</text>
<text x="30" y="66" font-size="15" text-anchor="start" fill="#374151" font-weight="bold">主机做的 9 件事（全部走端点 0 的控制传输）</text>
<text x="520" y="66" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="bold">地址</text>
<rect x="30" y="80" width="46" height="46" rx="23" fill="#d1d5db" stroke="#d1d5db" stroke-width="1.5"/>
<text x="53" y="109" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
<rect x="84" y="80" width="400" height="46" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="98" y="100" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">复位</text>
<text x="98" y="118" font-size="12" text-anchor="start" fill="#4b5563">SE0 ≥ 10 ms，设备回到地址 0</text>
<rect x="496" y="88" width="48" height="30" rx="15" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="520" y="108" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">0</text>
<line x1="53" y1="126" x2="53" y2="136" stroke="#d1d5db" stroke-width="2"/>
<rect x="30" y="136" width="46" height="46" rx="23" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
<text x="53" y="165" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
<rect x="84" y="136" width="400" height="46" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="98" y="156" font-size="13" text-anchor="start" fill="#3730a3" font-weight="bold">GET_DESCRIPTOR(设备)，要 64 字节</text>
<text x="98" y="174" font-size="12" text-anchor="start" fill="#4b5563">只为读到 bMaxPacketSize0</text>
<rect x="496" y="144" width="48" height="30" rx="15" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="520" y="164" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">0</text>
<line x1="53" y1="182" x2="53" y2="192" stroke="#d1d5db" stroke-width="2"/>
<rect x="30" y="192" width="46" height="46" rx="23" fill="#d1d5db" stroke="#d1d5db" stroke-width="1.5"/>
<text x="53" y="221" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
<rect x="84" y="192" width="400" height="46" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="98" y="212" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">再复位一次</text>
<text x="98" y="230" font-size="12" text-anchor="start" fill="#4b5563">Linux / Windows 的习惯</text>
<rect x="496" y="200" width="48" height="30" rx="15" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="520" y="220" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">0</text>
<line x1="53" y1="238" x2="53" y2="248" stroke="#d1d5db" stroke-width="2"/>
<rect x="30" y="248" width="46" height="46" rx="23" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/>
<text x="53" y="277" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text>
<rect x="84" y="248" width="400" height="46" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="98" y="268" font-size="13" text-anchor="start" fill="#c2410c" font-weight="bold">SET_ADDRESS(5)</text>
<text x="98" y="286" font-size="12" text-anchor="start" fill="#4b5563">状态阶段完成后设备才换地址</text>
<rect x="496" y="256" width="48" height="30" rx="15" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="520" y="276" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">0 → 5</text>
<line x1="53" y1="294" x2="53" y2="304" stroke="#d1d5db" stroke-width="2"/>
<rect x="30" y="304" width="46" height="46" rx="23" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
<text x="53" y="333" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text>
<rect x="84" y="304" width="400" height="46" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="98" y="324" font-size="13" text-anchor="start" fill="#3730a3" font-weight="bold">GET_DESCRIPTOR(设备)，18 字节</text>
<text x="98" y="342" font-size="12" text-anchor="start" fill="#4b5563">VID、PID、字符串编号</text>
<rect x="496" y="312" width="48" height="30" rx="15" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="520" y="332" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">5</text>
<line x1="53" y1="350" x2="53" y2="360" stroke="#d1d5db" stroke-width="2"/>
<rect x="30" y="360" width="46" height="46" rx="23" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
<text x="53" y="389" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">6</text>
<rect x="84" y="360" width="400" height="46" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="98" y="380" font-size="13" text-anchor="start" fill="#3730a3" font-weight="bold">GET_DESCRIPTOR(配置)，9 字节</text>
<text x="98" y="398" font-size="12" text-anchor="start" fill="#4b5563">先看 wTotalLength</text>
<rect x="496" y="368" width="48" height="30" rx="15" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="520" y="388" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">5</text>
<line x1="53" y1="406" x2="53" y2="416" stroke="#d1d5db" stroke-width="2"/>
<rect x="30" y="416" width="46" height="46" rx="23" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
<text x="53" y="445" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">7</text>
<rect x="84" y="416" width="400" height="46" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="98" y="436" font-size="13" text-anchor="start" fill="#3730a3" font-weight="bold">GET_DESCRIPTOR(配置)，全长</text>
<text x="98" y="454" font-size="12" text-anchor="start" fill="#4b5563">接口、端点 → 决定加载哪个驱动</text>
<rect x="496" y="424" width="48" height="30" rx="15" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="520" y="444" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">5</text>
<line x1="53" y1="462" x2="53" y2="472" stroke="#d1d5db" stroke-width="2"/>
<rect x="30" y="472" width="46" height="46" rx="23" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
<text x="53" y="501" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">8</text>
<rect x="84" y="472" width="400" height="46" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="98" y="492" font-size="13" text-anchor="start" fill="#3730a3" font-weight="bold">GET_DESCRIPTOR(字符串 0/1/2/3)</text>
<text x="98" y="510" font-size="12" text-anchor="start" fill="#4b5563">语言、厂商、产品、序列号</text>
<rect x="496" y="480" width="48" height="30" rx="15" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="520" y="500" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">5</text>
<line x1="53" y1="518" x2="53" y2="528" stroke="#d1d5db" stroke-width="2"/>
<rect x="30" y="528" width="46" height="46" rx="23" fill="#16a34a" stroke="#16a34a" stroke-width="1.5"/>
<text x="53" y="557" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">9</text>
<rect x="84" y="528" width="400" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="98" y="548" font-size="13" text-anchor="start" fill="#15803d" font-weight="bold">SET_CONFIGURATION(1)</text>
<text x="98" y="566" font-size="12" text-anchor="start" fill="#4b5563">端点开始工作，驱动接手</text>
<rect x="496" y="536" width="48" height="30" rx="15" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="520" y="556" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">5</text>
<text x="790" y="66" font-size="15" text-anchor="middle" fill="#374151" font-weight="bold">设备这一边：USB 状态机（规范 9.1）</text>
<rect x="640" y="92" width="260" height="56" rx="28" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
<text x="770" y="116" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Attached 已连接</text>
<text x="770" y="136" font-size="12" text-anchor="middle" fill="#4b5563">插上了，但还没供电</text>
<rect x="640" y="186" width="260" height="56" rx="28" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
<text x="770" y="210" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold">Powered 已上电</text>
<text x="770" y="230" font-size="12" text-anchor="middle" fill="#4b5563">VBUS 有电，等待复位</text>
<rect x="640" y="280" width="260" height="56" rx="28" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="770" y="304" font-size="14" text-anchor="middle" fill="#3730a3" font-weight="bold">Default 默认</text>
<text x="770" y="324" font-size="12" text-anchor="middle" fill="#4b5563">地址 0，只有端点 0 能用</text>
<rect x="640" y="374" width="260" height="56" rx="28" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="770" y="398" font-size="14" text-anchor="middle" fill="#c2410c" font-weight="bold">Address 已寻址</text>
<text x="770" y="418" font-size="12" text-anchor="middle" fill="#4b5563">有了自己的地址</text>
<rect x="640" y="468" width="260" height="56" rx="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="770" y="492" font-size="14" text-anchor="middle" fill="#15803d" font-weight="bold">Configured 已配置</text>
<text x="770" y="512" font-size="12" text-anchor="middle" fill="#4b5563">所有端点就绪，可以干活</text>
<line x1="770" y1="148" x2="770" y2="184" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<text x="780" y="172.0" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">VBUS 上电</text>
<line x1="770" y1="242" x2="770" y2="278" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<text x="780" y="266.0" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">总线复位</text>
<line x1="770" y1="336" x2="770" y2="372" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<text x="780" y="360.0" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">SET_ADDRESS 的状态阶段完成</text>
<line x1="770" y1="430" x2="770" y2="466" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<text x="780" y="454.0" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">SET_CONFIGURATION(非 0)</text>
<path d="M900,496 C980,496 980,308 902,308" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ahr)"/>
<path d="M900,402 C950,402 950,316 902,316" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ahr)"/>
<text x="770" y="541" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">红色虚线：任何状态下遇到总线复位，都回到 Default</text>
<rect x="600" y="552" width="380" height="72" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
<text x="614" y="574" font-size="12" text-anchor="start" fill="#374151">另外：总线 3 ms 没有活动 → Suspended（挂起，</text>
<text x="614" y="594" font-size="12" text-anchor="start" fill="#374151">电流 ≤ 2.5 mA）；有活动或远程唤醒 → 回到原状态。</text>
<text x="614" y="614" font-size="12" text-anchor="start" fill="#15803d" font-weight="bold">STM32 固件里的 tud_mount_cb 对应进入 Configured。</text>
</svg>
