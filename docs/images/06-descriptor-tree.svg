<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs>
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500" y="32" font-size="20" text-anchor="middle" fill="#111827" font-weight="bold">描述符：设备的“简历”，一棵树 + 一张字符串表</text>
<rect x="30" y="56" width="300" height="120" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="42" y="78" font-size="14" text-anchor="start" fill="#3730a3" font-weight="bold">设备描述符（18 字节，只有一个）</text>
<text x="42" y="100" font-size="12" text-anchor="start" fill="#374151">idVendor 0xCAFE  idProduct 0x0006</text>
<text x="42" y="119" font-size="12" text-anchor="start" fill="#374151">bMaxPacketSize0 = 64（端点 0 包长）</text>
<text x="42" y="138" font-size="12" text-anchor="start" fill="#374151">iManufacturer=1 iProduct=2 iSerial=3</text>
<text x="42" y="157" font-size="12" text-anchor="start" fill="#374151">bNumConfigurations = 1</text>
<line x1="120" y1="176" x2="120" y2="204" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<rect x="30" y="206" width="300" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="42" y="228" font-size="14" text-anchor="start" fill="#b45309" font-weight="bold">配置描述符 1（9 字节）</text>
<text x="42" y="250" font-size="12" text-anchor="start" fill="#374151">wTotalLength = 39（整棵子树的长度）</text>
<text x="42" y="269" font-size="12" text-anchor="start" fill="#374151">bNumInterfaces = 1  bMaxPower = 100 mA</text>
<text x="42" y="288" font-size="12" text-anchor="start" fill="#374151">bConfigurationValue = 1</text>
<line x1="120" y1="306" x2="120" y2="334" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<rect x="30" y="336" width="300" height="82" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="42" y="358" font-size="14" text-anchor="start" fill="#15803d" font-weight="bold">接口描述符 0（9 字节）</text>
<text x="42" y="380" font-size="12" text-anchor="start" fill="#374151">类 0xFF 厂商自定义  bNumEndpoints = 3</text>
<text x="42" y="399" font-size="12" text-anchor="start" fill="#374151">iInterface = 4</text>
<rect x="30" y="440" width="96" height="56" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="78" y="461" font-size="13" text-anchor="middle" fill="#c2410c" font-weight="bold">端点 0x81</text>
<text x="78" y="482" font-size="11" text-anchor="middle" fill="#374151">中断 IN</text>
<text x="78" y="482" font-size="11" text-anchor="start" fill="#111827"></text>
<line x1="120" y1="418" x2="78" y2="438" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="134" y="440" width="96" height="56" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="182" y="461" font-size="13" text-anchor="middle" fill="#c2410c" font-weight="bold">端点 0x02</text>
<text x="182" y="482" font-size="11" text-anchor="middle" fill="#374151">批量 OUT</text>
<text x="182" y="482" font-size="11" text-anchor="start" fill="#111827"></text>
<line x1="120" y1="418" x2="182" y2="438" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="238" y="440" width="96" height="56" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="286" y="461" font-size="13" text-anchor="middle" fill="#c2410c" font-weight="bold">端点 0x82</text>
<text x="286" y="482" font-size="11" text-anchor="middle" fill="#374151">批量 IN</text>
<text x="286" y="482" font-size="11" text-anchor="start" fill="#111827"></text>
<line x1="120" y1="418" x2="286" y2="438" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="30" y="514" font-size="12" text-anchor="start" fill="#4b5563">每个端点 7 字节：地址、类型、包长、bInterval。端点 0 没有描述符。</text>
<text x="620" y="66" font-size="15" text-anchor="start" fill="#374151" font-weight="bold">字符串描述符（UTF-16LE，按编号取）</text>
<rect x="620" y="80" width="350" height="36" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="620" y="80" width="36" height="36" rx="6" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="638" y="104" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" font-family="monospace">0</text>
<text x="670" y="104" font-size="13" text-anchor="start" fill="#111827">语言列表：0x0409 英语（美国）</text>
<rect x="620" y="124" width="350" height="36" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="620" y="124" width="36" height="36" rx="6" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="638" y="148" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" font-family="monospace">1</text>
<text x="670" y="148" font-size="13" text-anchor="start" fill="#111827">“miniusb 教程”</text>
<rect x="620" y="168" width="350" height="36" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="620" y="168" width="36" height="36" rx="6" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="638" y="192" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" font-family="monospace">2</text>
<text x="670" y="192" font-size="13" text-anchor="start" fill="#111827">“温湿度记录仪”</text>
<rect x="620" y="212" width="350" height="36" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="620" y="212" width="36" height="36" rx="6" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="638" y="236" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" font-family="monospace">3</text>
<text x="670" y="236" font-size="13" text-anchor="start" fill="#111827">“SN-0001”</text>
<rect x="620" y="256" width="350" height="36" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="620" y="256" width="36" height="36" rx="6" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="638" y="280" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" font-family="monospace">4</text>
<text x="670" y="280" font-size="13" text-anchor="start" fill="#111827">“传感器接口”</text>
<path d="M330,120 C460,120 500,142 616,142" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<path d="M330,120 C460,120 500,186 616,186" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<path d="M330,120 C460,120 500,230 616,230" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<path d="M330,392 C470,392 500,274 616,274" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="620" y="316" font-size="12" text-anchor="start" fill="#4b5563">描述符里只存编号，0 表示“没有”。</text>
<text x="620" y="336" font-size="12" text-anchor="start" fill="#4b5563">主机先读 0 号拿到语言 ID，再用它读其他字符串。</text>
<text x="620" y="356" font-size="12" text-anchor="start" fill="#4b5563">UTF-16 意味着产品名可以直接写中文。</text>
<rect x="620" y="380" width="350" height="120" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="634" y="404" font-size="14" text-anchor="start" fill="#c2410c" font-weight="bold">主机怎么读这棵树</text>
<text x="634" y="428" font-size="12" text-anchor="start" fill="#374151">GET_DESCRIPTOR(设备)   → 18 字节</text>
<text x="634" y="450" font-size="12" text-anchor="start" fill="#374151">GET_DESCRIPTOR(配置)   → 整棵子树一次读回</text>
<text x="634" y="472" font-size="12" text-anchor="start" fill="#374151">GET_DESCRIPTOR(字符串 n) → 一个字符串</text>
<text x="634" y="492" font-size="12" text-anchor="start" fill="#b91c1c" font-weight="bold">接口和端点描述符不能单独读。</text>
<line x1="20" y1="532" x2="980" y2="532" stroke="#e5e7eb" stroke-width="2"/>
<text x="30" y="556" font-size="13" text-anchor="start" fill="#374151" font-weight="bold">配置描述符在内存里是“压平”的一整串（39 字节），每个描述符的第 1 字节 bLength 告诉你跳多远：</text>
<rect x="30" y="568" width="211.5" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="135.75" y="588" font-size="11" text-anchor="middle" fill="#111827" font-family="monospace">09 02 27 00 01 01 00 80 32</text>
<text x="135.75" y="616" font-size="12" text-anchor="middle" fill="#b45309" font-weight="bold">配置 9</text>
<rect x="245.5" y="568" width="211.5" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="351.25" y="588" font-size="11" text-anchor="middle" fill="#111827" font-family="monospace">09 04 00 00 03 FF 00 00 04</text>
<text x="351.25" y="616" font-size="12" text-anchor="middle" fill="#15803d" font-weight="bold">接口 9</text>
<rect x="461.0" y="568" width="164.5" height="30" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="543.25" y="588" font-size="11" text-anchor="middle" fill="#111827" font-family="monospace">07 05 81 03 08 00 64</text>
<text x="543.25" y="616" font-size="12" text-anchor="middle" fill="#c2410c" font-weight="bold">端点 7</text>
<rect x="629.5" y="568" width="164.5" height="30" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="711.75" y="588" font-size="11" text-anchor="middle" fill="#111827" font-family="monospace">07 05 02 02 40 00 00</text>
<text x="711.75" y="616" font-size="12" text-anchor="middle" fill="#c2410c" font-weight="bold">端点 7</text>
<rect x="798.0" y="568" width="164.5" height="30" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="880.25" y="588" font-size="11" text-anchor="middle" fill="#111827" font-family="monospace">07 05 82 02 40 00 00</text>
<text x="880.25" y="616" font-size="12" text-anchor="middle" fill="#c2410c" font-weight="bold">端点 7</text>
</svg>
