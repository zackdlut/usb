<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" font-size="14">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs>
<rect width="1000" height="660" fill="#ffffff"/>
<text x="500" y="32" font-size="20" text-anchor="middle" fill="#111827" font-weight="bold">CDC-ACM 虚拟串口：两个接口 + 三个类请求 + 一个 ZLP 规则</text>
<text x="30" y="66" font-size="15" text-anchor="start" fill="#374151" font-weight="bold">① 一个功能，两个接口，用 IAD 绑在一起</text>
<rect x="30" y="78" width="440" height="40" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="44" y="103" font-size="12" text-anchor="start" fill="#111827" font-weight="bold">设备描述符：类 0xEF / 0x02 / 0x01（“我用了 IAD”）</text>
<rect x="30" y="126" width="440" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="44" y="151" font-size="12" text-anchor="start" fill="#b45309" font-weight="bold">IAD：从接口 0 开始的 2 个接口属于同一个 CDC 功能</text>
<rect x="30" y="176" width="214" height="220" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="137" y="198" font-size="13" text-anchor="middle" fill="#3730a3" font-weight="bold">接口 0：通信接口</text>
<text x="137" y="216" font-size="11" text-anchor="middle" fill="#374151">类 0x02 CDC，子类 0x02 ACM</text>
<rect x="42" y="228" width="190" height="24" rx="4" fill="#ffffff" stroke="#4f46e5" stroke-width="1"/>
<text x="137" y="245" font-size="11" text-anchor="middle" fill="#3730a3">Header：CDC 1.10</text>
<rect x="42" y="258" width="190" height="24" rx="4" fill="#ffffff" stroke="#4f46e5" stroke-width="1"/>
<text x="137" y="275" font-size="11" text-anchor="middle" fill="#3730a3">Call Management</text>
<rect x="42" y="288" width="190" height="24" rx="4" fill="#ffffff" stroke="#4f46e5" stroke-width="1"/>
<text x="137" y="305" font-size="11" text-anchor="middle" fill="#3730a3">ACM：支持线路编码请求</text>
<rect x="42" y="318" width="190" height="24" rx="4" fill="#ffffff" stroke="#4f46e5" stroke-width="1"/>
<text x="137" y="335" font-size="11" text-anchor="middle" fill="#3730a3">Union：主 0，从 1</text>
<rect x="42" y="352" width="190" height="34" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="137" y="368" font-size="11" text-anchor="middle" fill="#c2410c" font-weight="bold">0x81 中断 IN · 8 B</text>
<text x="137" y="382" font-size="10" text-anchor="middle" fill="#4b5563">串口状态通知（可不用）</text>
<rect x="256" y="176" width="214" height="220" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="363" y="198" font-size="13" text-anchor="middle" fill="#15803d" font-weight="bold">接口 1：数据接口</text>
<text x="363" y="216" font-size="11" text-anchor="middle" fill="#374151">类 0x0A CDC Data</text>
<rect x="268" y="236" width="190" height="50" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="363" y="256" font-size="12" text-anchor="middle" fill="#c2410c" font-weight="bold">0x02 批量 OUT · 64 B</text>
<text x="363" y="274" font-size="10" text-anchor="middle" fill="#4b5563">主机 → 设备：你在终端敲的字</text>
<rect x="268" y="298" width="190" height="50" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="363" y="318" font-size="12" text-anchor="middle" fill="#c2410c" font-weight="bold">0x82 批量 IN · 64 B</text>
<text x="363" y="336" font-size="10" text-anchor="middle" fill="#4b5563">设备 → 主机：终端里显示的字</text>
<text x="363" y="378" font-size="11" text-anchor="middle" fill="#15803d" font-weight="bold">真正的串口数据只走这里</text>
<text x="510" y="66" font-size="15" text-anchor="start" fill="#374151" font-weight="bold">② 终端程序打开串口时，驱动发的类请求（发给接口 0）</text>
<rect x="510" y="80" width="460" height="42" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="522" y="98" font-size="12" text-anchor="start" fill="#3730a3" font-weight="bold" font-family="monospace">0x20 SET_LINE_CODING</text>
<text x="522" y="115" font-size="11" text-anchor="start" fill="#374151">主机 → 设备，7 字节：波特率等</text>
<rect x="510" y="130" width="460" height="42" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="522" y="148" font-size="12" text-anchor="start" fill="#3730a3" font-weight="bold" font-family="monospace">0x21 GET_LINE_CODING</text>
<text x="522" y="165" font-size="11" text-anchor="start" fill="#374151">设备 → 主机，读回当前设置</text>
<rect x="510" y="180" width="460" height="42" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="522" y="198" font-size="12" text-anchor="start" fill="#3730a3" font-weight="bold" font-family="monospace">0x22 SET_CONTROL_LINE_STATE</text>
<text x="522" y="215" font-size="11" text-anchor="start" fill="#374151">无数据；wValue bit0 = DTR，bit1 = RTS</text>
<text x="510" y="252" font-size="12" text-anchor="start" fill="#c2410c" font-weight="bold">线路编码的 7 个字节（115200 8N1）：</text>
<rect x="510" y="262" width="200" height="48" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="610.0" y="282" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" font-family="monospace">00 C2 01 00</text>
<text x="610.0" y="300" font-size="10" text-anchor="middle" fill="#c2410c">dwDTERate = 115200</text>
<rect x="714" y="262" width="80" height="48" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="754.0" y="282" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" font-family="monospace">00</text>
<text x="754.0" y="300" font-size="10" text-anchor="middle" fill="#c2410c">停止位 1</text>
<rect x="798" y="262" width="80" height="48" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="838.0" y="282" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" font-family="monospace">00</text>
<text x="838.0" y="300" font-size="10" text-anchor="middle" fill="#c2410c">无校验</text>
<rect x="882" y="262" width="80" height="48" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="922.0" y="282" font-size="13" text-anchor="middle" fill="#111827" font-weight="bold" font-family="monospace">08</text>
<text x="922.0" y="300" font-size="10" text-anchor="middle" fill="#c2410c">8 数据位</text>
<text x="510" y="334" font-size="12" text-anchor="start" fill="#4b5563">虚拟串口没有真正的 UART，波特率可以忽略；</text>
<text x="510" y="352" font-size="12" text-anchor="start" fill="#4b5563">USB 转 TTL 芯片（CH340、CP2102）就按它配置 UART。</text>
<text x="510" y="376" font-size="12" text-anchor="start" fill="#15803d" font-weight="bold">DTR = 1 常被当作“终端打开了端口”，固件可以据此才开始发数据。</text>
<line x1="20" y1="412" x2="980" y2="412" stroke="#e5e7eb" stroke-width="2"/>
<text x="30" y="438" font-size="14" text-anchor="start" fill="#374151" font-weight="bold">③ 批量 IN 传输什么时候算“结束”？收到短包（&lt; 64 字节）的那一刻。主机的读缓冲通常远大于 64 字节。</text>
<text x="30" y="484" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">发 100 字节</text>
<rect x="210" y="464" width="120" height="34" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="270.0" y="486" font-size="12" text-anchor="middle" fill="#15803d" font-weight="bold">64</text>
<rect x="336" y="464" width="96" height="34" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="384.0" y="486" font-size="12" text-anchor="middle" fill="#b45309" font-weight="bold">36 短包</text>
<text x="448" y="486" font-size="12" text-anchor="start" fill="#15803d" font-weight="bold">√ 第二包是短包 → 读请求立刻完成</text>
<text x="30" y="546" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">发 64 字节 + ZLP</text>
<rect x="210" y="526" width="120" height="34" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="270.0" y="548" font-size="12" text-anchor="middle" fill="#15803d" font-weight="bold">64</text>
<rect x="336" y="526" width="96" height="34" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="384.0" y="548" font-size="12" text-anchor="middle" fill="#b45309" font-weight="bold">0 字节 ZLP</text>
<text x="448" y="548" font-size="12" text-anchor="start" fill="#15803d" font-weight="bold">√ 零长度包也是短包 → 立刻完成</text>
<text x="30" y="608" font-size="13" text-anchor="start" fill="#111827" font-weight="bold">发 64 字节，不补 ZLP</text>
<rect x="210" y="588" width="120" height="34" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="270.0" y="610" font-size="12" text-anchor="middle" fill="#15803d" font-weight="bold">64</text>
<rect x="336" y="588" width="80" height="34" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="376.0" y="610" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">NAK</text>
<rect x="422" y="588" width="80" height="34" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="462.0" y="610" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">NAK</text>
<rect x="508" y="588" width="80" height="34" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="548.0" y="610" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">NAK…</text>
<text x="604" y="610" font-size="12" text-anchor="start" fill="#b91c1c" font-weight="bold">× 不知道后面还有没有 → 一直等到超时</text>
<text x="30" y="648" font-size="12" text-anchor="start" fill="#c2410c" font-weight="bold">规则：一次写的长度正好是包长的整数倍时，发送方要在后面补一个 ZLP。TinyUSB 的 CDC 会自动处理；自己写栈时最容易忘。</text>
</svg>
